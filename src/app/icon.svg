<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- shadow under the car -->
  <ellipse cx="32" cy="47" rx="22" ry="3.2" fill="#92400e" opacity="0.25"/>
  <!-- car body -->
  <path fill="#ffffff" d="M12 40
    c0-1.6 0.9-2.4 2.2-2.9
    l3.5-1.3 4.2-7.2
    c1-1.7 2.8-2.7 4.8-2.7
    h9.6 c2 0 3.9 1.1 4.9 2.9
    l3.4 6.9 3.2 1.2
    c1.4 0.5 2.5 1.4 2.5 3.1
    v2.4 c0 1.1-0.9 2-2 2
    H14 c-1.1 0-2-0.9-2-2 z"/>
  <!-- windows -->
  <path fill="#7dd3fc" d="M23.5 30.5 c0.5-0.9 1.5-1.5 2.6-1.5 H31 v7 H20.5 z"/>
  <path fill="#7dd3fc" d="M33 29 h4.5 c1.1 0 2.1 0.6 2.7 1.6 l2.9 5.4 H33 z"/>
  <!-- wheels -->
  <circle cx="22" cy="45" r="6" fill="#1f2937"/>
  <circle cx="22" cy="45" r="2.4" fill="#e5e7eb"/>
  <circle cx="44" cy="45" r="6" fill="#1f2937"/>
  <circle cx="44" cy="45" r="2.4" fill="#e5e7eb"/>
  <!-- headlight -->
  <circle cx="50.5" cy="39.5" r="1.6" fill="#fde68a"/>
</svg>
